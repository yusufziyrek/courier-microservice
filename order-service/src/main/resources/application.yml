server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: order-service
    
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:orderdb}
    username: ${DB_USER:orderuser}
    password: ${DB_PASSWORD:orderpass123}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate # Tabloları asla Hibernate üretmesin! Flyway yönetecek.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  flyway:
    enabled: true
    baseline-on-migrate: true
    
# Auth service ile aynı şifreleme anahtarını paylaşmak zorunda.
jwt:
  secret: ${JWT_SECRET:4fSI1eZ8v/Z49XUntoAPc474kR3JS0OKymkUa30Zd1I=}
