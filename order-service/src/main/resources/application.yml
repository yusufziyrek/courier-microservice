server:
  port: ${SERVER_PORT}

spring:
  application:
    name: order-service
    
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate # Tabloları asla Hibernate üretmesin! Flyway yönetecek.
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: true
    
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true
    
# Auth service ile aynı şifreleme anahtarını paylaşmak zorunda.
jwt:
  secret: ${JWT_SECRET}
